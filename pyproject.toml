[project]
name = "jev-style"
dynamic = ["version"]
description = "Local classification and routing for AI agents, with calibrated probabilities, a systemone-compatible API, MCP tools and a Claude Code guard."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "chaoliangUNSW" }]
keywords = ["decision-model", "jev", "classification", "text-classification", "llm-routing", "calibration", "mlx", "gguf", "mcp", "claude-code", "agent-skills"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "huggingface_hub>=0.34",
  "numpy>=1.26",
  "tokenizers>=0.21",
  "mcp>=2.0",
  "zstandard>=0.23",
]

[project.optional-dependencies]
torch = ["torch>=2.4", "transformers>=5.0", "pillow>=10", "torchvision>=0.19"]   # pillow + torchvision: the 2B v4 runtime (images)
mlx = ["mlx>=0.29; sys_platform == 'darwin'", "mlx-lm==0.31.3; sys_platform == 'darwin'"]
mcp = []                                  # kept so jev-style[mcp] still resolves; mcp is a core dependency since 0.3.0
all = ["jev-style[torch,mlx,mcp]"]
dev = ["pytest>=8", "jev-style[mcp]", "pillow>=10"]

[project.scripts]
jev-style = "jev_style.cli:main"

[project.urls]
Homepage = "https://jevstyle.com"
Repository = "https://github.com/lawrence3699/jev-style"
Changelog = "https://github.com/lawrence3699/jev-style/blob/main/CHANGELOG.md"
Issues = "https://github.com/lawrence3699/jev-style/issues"
Models = "https://huggingface.co/collections/chaoliangUNSW/jev-style-decision-v4-2b"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "jev_style/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["jev_style"]

[tool.hatch.build.targets.sdist]
include = ["/jev_style", "/tests", "/examples", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE", "/pyproject.toml"]
exclude = ["**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
